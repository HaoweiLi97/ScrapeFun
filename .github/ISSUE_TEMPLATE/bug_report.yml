name: 故障报告
description: 提交可公开复现的 ScrapeFun 问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        请先查看部署与支持文档。账号、订单和激活问题请联系 scrapefun@outlook.com；安全漏洞请按 SECURITY.md 私密报告。
        请勿填写密码、激活码、Token、私人资源链接或上传完整备份。
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: Server / Client 版本、stable 或 beta、操作系统、CPU 架构及部署方式。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 提供能重复触发问题的最小操作步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 附错误提示、出错时间及最近正常运行的版本。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏日志或截图
      description: 仅提供相关片段，移除凭据、私人路径和带签名资源链接。
